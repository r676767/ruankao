<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#6aa7ff" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>系规 · 综合分章节刷题 2026</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- 【诊断】任何脚本语法错误/加载失败/运行时未捕获异常 → 立刻红屏弹窗，不用再瞎猜 -->
  <script>
    (function () {
      var bootTs = Date.now();
      var bootLog = [];
      window.__RUANKAO_BOOT = {
        log: function (step, detail) {
          var row = { t: (Date.now() - bootTs) + 'ms', step: step, detail: detail || '' };
          bootLog.push(row);
          try { console.log('[RUANKAO BOOT]', row.t, step, detail); } catch (e) {}
          // 同步更新 loader 文案显示具体走到哪一步了（用户不用看控制台就能知道卡在哪）
          try {
            var ldr = document.getElementById('loader');
            if (ldr) {
              var sub = ldr.querySelector('.loader-substep');
              if (!sub) { sub = document.createElement('div'); sub.className = 'loader-substep'; sub.style.fontSize='12px'; sub.style.marginTop='10px'; sub.style.color='#6aa7ff'; ldr.appendChild(sub); }
              sub.textContent = '(' + row.t + ') ' + step + (detail ? ' → ' + detail : '');
            }
          } catch (e) {}
        },
        logs: bootLog
      };
      window.__RUANKAO_BOOT.log('00 HTML loaded');

      function showFatal(title, body, extra) {
        try {
          var ldr = document.getElementById('loader');
          if (ldr) {
            ldr.querySelector('.spinner') && (ldr.querySelector('.spinner').style.display='none');
            ldr.innerHTML = '' +
              '<div style="color:#d93025;font-weight:700;font-size:16px;margin-bottom:12px">❌ ' + title + '</div>' +
              '<div style="background:#fff0f0;border:1px solid #f5bfbf;border-radius:8px;padding:12px 14px;color:#7b1a1a;font-size:13px;line-height:1.6;text-align:left;max-width:520px">' +
              (body || '') +
              (extra ? '<hr style="border:none;border-top:1px dashed #e5a3a3;margin:10px 0">' + extra : '') +
              '</div>' +
              '<div style="margin-top:14px;font-size:12px;color:#888">把上面红色错误框拍照发我 → 10 秒修好</div>';
            ldr.style.textAlign='left'; ldr.style.maxWidth='580px'; ldr.style.margin='20px auto';
            ldr.hidden = false;
          }
        } catch (e) {}
        try {
          alert('软考刷题 - 启动失败：' + title + '\n\n' + body + '\n\n把上面的红色错误框内容发给开发者即可解决。');
        } catch (e) {}
      }
      window.addEventListener('error', function (ev) {
        var msg = (ev.error && ev.error.stack) ? (ev.error.name + ': ' + ev.error.message + '\n' + ev.error.stack.split(/\n/).slice(0, 6).join('\n')) : (ev.message || String(ev));
        showFatal('脚本执行出错（' + (ev.filename ? ev.filename.split('/').pop() : '') + ':' + ev.lineno + ')',
          String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>'),
          '建议：① Ctrl+Shift+R 强制刷新清缓存  ② 关闭所有黑色窗口后重新双击 bat 再试');
      }, true);
      window.addEventListener('unhandledrejection', function (ev) {
        var msg = (ev.reason && ev.reason.stack) ? (ev.reason.name + ': ' + ev.reason.message + '\n' + ev.reason.stack.split(/\n/).slice(0, 6).join('\n')) : String(ev.reason);
        showFatal('异步 Promise 未捕获异常',
          String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>'),
          '建议：① Ctrl+Shift+R 强制刷新  ② 检查 Token/GistID 权限和网络');
      }, true);
      window.addEventListener('DOMContentLoaded', function () { window.__RUANKAO_BOOT.log('01 DOMContentLoaded'); });
    })();
  </script>
  <script>window.__RUANKAO_BOOT && window.__RUANKAO_BOOT.log('02 bootstrap OK (error handlers armed)');</script>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" aria-label="返回" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div class="title-area">
        <div class="app-title" id="pageTitle">系规分章节题库</div>
        <div class="app-subtitle" id="pageSubtitle">系统规划与管理师 · 2026有解析版</div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="云端同步设置" title="☁️ 云端同步（手机/电脑互通）">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button class="icon-btn" id="favBtn" aria-label="收藏" title="收藏本题" style="display:none">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M22 9.8l-7.2-.6L12 2 9.2 8.6 2 9.2l5.4 4.7L5.8 21 12 17.3 18.2 21l-1.6-7.1L22 9.8zM12 15.2l-3.8 2.3 1-4.4-3.4-3 4.4-.4L12 6l1.8 3.7 4.4.4-3.4 3 1 4.4z"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" aria-label="重置进度" title="重置本节进度">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        </button>
      </div>
    </header>

    <!-- 页面容器 -->
    <main class="main">
      <!-- ============ 章节列表视图 ============ -->
      <section class="view" id="homeView">
        <div class="stats-card">
          <div class="stats-row">
            <div class="stat">
              <div class="stat-num" id="totalDone">0</div>
              <div class="stat-label">已完成</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
              <div class="stat-num" id="totalAcc">0%</div>
              <div class="stat-label">正确率</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
              <div class="stat-num" id="totalLeft">0</div>
              <div class="stat-label">待刷</div>
            </div>
          </div>

          <!-- 快捷入口：错题本 / 收藏夹 / 同步 -->
          <div class="quick-grid">
            <div class="quick-card" id="wrongBtn">
              <div class="quick-icon wrong-ic">📕</div>
              <div class="quick-info">
                <div class="quick-title">错题本</div>
                <div class="quick-sub"><b id="wrongCount">0</b> 道待巩固</div>
              </div>
              <span class="quick-arrow">›</span>
            </div>
            <div class="quick-card" id="favBtnBar">
              <div class="quick-icon fav-ic">⭐</div>
              <div class="quick-info">
                <div class="quick-title">收藏夹</div>
                <div class="quick-sub"><b id="favCount">0</b> 道收藏</div>
              </div>
              <span class="quick-arrow">›</span>
            </div>
            <div class="quick-card" id="exportBtn">
              <div class="quick-icon exp-ic">📤</div>
              <div class="quick-info">
                <div class="quick-title">导出进度</div>
                <div class="quick-sub">生成备份文件，存本地或发给其它设备</div>
              </div>
              <span class="quick-arrow">›</span>
            </div>
            <div class="quick-card" id="importBtn">
              <div class="quick-icon imp-ic">📥</div>
              <div class="quick-info">
                <div class="quick-title">导入进度</div>
                <div class="quick-sub">从备份文件恢复，或合并另一台设备的进度</div>
              </div>
              <span class="quick-arrow">›</span>
            </div>
          </div>
        </div>

        <div class="section-label">
          <span>章节练习</span>
          <button class="chip-btn" id="continueBtn" hidden>继续上次</button>
        </div>

        <div class="chapter-list" id="chapterList"></div>
        <div style="height:32px"></div>
      </section>

      <!-- ============ 答题视图 ============ -->
      <section class="view" id="quizView" hidden>
        <!-- 题目进度条 -->
        <div class="quiz-progress" id="quizProgress">
          <div class="quiz-progress-bar" id="quizProgressBar"></div>
          <div class="quiz-progress-text">
            <span id="quizIndex">1 / 100</span>
            <span id="quizRate">正确率 —</span>
          </div>
        </div>

        <!-- 题目区 -->
        <div class="question-card" id="questionCard">
          <div class="q-tags">
            <span class="tag tag-source" id="qSource"></span>
            <span class="tag tag-index" id="qIndexTag">#1</span>
            <span class="tag tag-type" id="qTypeTag">单选</span>
          </div>
          <div class="q-stem" id="qStem"></div>
          <div class="q-options" id="qOptions"></div>
        </div>

        <!-- 结果卡片（答题后显示） -->
        <div class="result-card" id="resultCard" hidden>
          <div class="result-header" id="resultHeader"></div>
          <div class="result-my">
            <span>你的答案</span>
            <b id="myAnswer">—</b>
          </div>
          <div class="result-right">
            <span>正确答案</span>
            <b id="rightAnswer">—</b>
          </div>
          <div class="analysis-block" id="analysisBlock" hidden>
            <div class="analysis-title">📘 答案解析</div>
            <div class="analysis-text" id="analysisText"></div>
          </div>
        </div>

        <div style="height:96px"></div>
      </section>

      <!-- ============ 错题本视图 ============ -->
      <section class="view" id="wrongView" hidden>
        <div class="list-toolbar">
          <button class="chip-btn primary" id="wrongPracticeBtn">练习错题</button>
          <button class="chip-btn danger" id="wrongClearBtn">清空错题本</button>
        </div>
        <div class="list-wrap" id="wrongList"></div>
      </section>

      <!-- ============ 收藏夹视图 ============ -->
      <section class="view" id="favoriteView" hidden>
        <div class="list-wrap" id="favList"></div>
      </section>
    </main>

    <!-- 底部操作栏（答题视图） -->
    <footer class="bottom-bar" id="bottomBar" hidden>
      <button class="nav-btn" id="prevBtn">
        <span class="nav-ic">‹</span> 上一题
      </button>
      <button class="nav-btn nav-btn-primary" id="submitBtn">
        提交答案
      </button>
      <button class="nav-btn" id="nextBtn">
        下一题 <span class="nav-ic">›</span>
      </button>
      <button class="nav-btn ghost" id="cardBtn">答题卡</button>
    </footer>

    <!-- 答题卡浮层 -->
    <div class="sheet-mask" id="sheetMask" hidden></div>
    <aside class="sheet" id="sheet" hidden>
      <div class="sheet-header">
        <div class="sheet-title" id="sheetTitle">答题卡</div>
        <button class="icon-btn" id="closeSheet" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
        </button>
      </div>
      <div class="sheet-summary" id="sheetSummary"></div>
      <div class="sheet-grid" id="sheetGrid"></div>
    </aside>

    <!-- 加载中 -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div>正在加载题库…</div>
      <div class="loader-substep" style="font-size:12px;margin-top:10px;color:#6aa7ff">等待脚本启动…</div>
    </div>
  </div>
  <script>
    // 【诊断】每个外链脚本加载失败（404/被墙/Content-Length 不匹配）立刻 alert 红色错误框，不用再瞎猜
    function _onScriptFail(ev) {
      var s = ev && ev.target && ev.target.src ? ev.target.src.split('/').pop() : 'script';
      window.addEventListener('DOMContentLoaded', function () {
        window.__RUANKAO_BOOT && window.__RUANKAO_BOOT.log('FATAL 脚本加载失败：' + s);
        if (window.__RUANKAO_BOOT && typeof window.__RUANKAO_BOOT === 'object') {
          var ldr = document.getElementById('loader');
          if (ldr) {
            ldr.querySelector && ldr.querySelector('.spinner') && (ldr.querySelector('.spinner').style.display='none');
            ldr.innerHTML =
              '<div style="color:#d93025;font-weight:700;font-size:16px;margin-bottom:12px">❌ 脚本加载失败：' + s + '</div>' +
              '<div style="background:#fff0f0;border:1px solid #f5bfbf;border-radius:8px;padding:12px 14px;color:#7b1a1a;font-size:13px;line-height:1.6;text-align:left;max-width:540px">' +
              '服务器上找不到这个 <b>' + s + '</b> 文件，或浏览器缓存了过期版本。<br><br>' +
              '<b>解决办法（按顺序做）：</b><br>' +
              '① 页面上按 <code style="background:#fff5e6;padding:1px 6px;border-radius:4px">Ctrl + Shift + R</code>（强制刷新，跳过缓存）<br>' +
              '② 关闭所有黑色 cmd/node 窗口，然后重新双击「桌面快捷-软考刷题（个人专用·已配同步）.bat」<br>' +
              '③ 在 PowerShell 执行：<code style="background:#fff5e6;padding:1px 6px;border-radius:4px">Get-Process node -ErrorAction SilentlyContinue \| Stop-Process -Force ; cd E:\code\ruankao ; node scripts/server.js</code> 再手动开 <code style="background:#fff5e6;padding:1px 6px;border-radius:4px">http://localhost:8080/</code><br>' +
              '④ 仍失败：把这段红色错误框截图发我。' +
              '</div>';
            ldr.style.textAlign='left'; ldr.style.maxWidth='600px'; ldr.style.margin='24px auto'; ldr.hidden=false;
          }
          alert('脚本加载失败：' + s + '\n解决办法已经显示在页面红色错误框里，按 Ctrl+Shift+R 强制刷新试试。');
        }
      });
    }
  </script>
  <script src="./gist-client.js" onerror="_onScriptFail(event)"></script>
  <script src="./app.js" onerror="_onScriptFail(event)"></script>
  <script>window.__RUANKAO_BOOT && window.__RUANKAO_BOOT.log('10 All script tags injected');</script>
</body>
</html>
