# Render Blueprint (Infrastructure as Code)
# 使用方法：Render Dashboard → Blueprints → New Blueprint Instance → 选 r676767/ruankao 仓库 → Apply
# Render 会自动创建 Web Service，并按以下配置构建 & 启动，完全无需手动填 GUI 表单
services:
  - type: web
    name: ruankao
    runtime: node
    repo: https://github.com/r676767/ruankao
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: node scripts/server.js
    autoDeploy: yes
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GIST_ID
        value: fca886b3e1393d79eb9b8d4e6afda25f
      - key: GH_TOKEN
        sync: false    # secret: Apply 时在 Render 页面粘贴你的 GitHub PAT (gist scope)，不要写进 YAML
